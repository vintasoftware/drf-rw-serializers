[tool.poetry]
name = "drf-rw-serializers"
version = "1.4.0"
description = "Generic views, viewsets and mixins that extend the Django REST Framework ones adding separated serializers for read and write operations"
authors = ["Vinta Software <contact@vinta.com.br>"]
license = "MIT"
readme = "README.rst"

[tool.poetry.urls]
"Homepage" = "https://github.com/vintasoftware/drf-rw-serializers"
"Documentation" = "https://drf-rw-serializers.readthedocs.io"
"Bug Tracker" = "https://github.com/vintasoftware/drf-rw-serializers/issues"
"Source" = "https://github.com/vintasoftware/drf-rw-serializers/"
"Changelog" = "https://github.com/vintasoftware/drf-rw-serializers/blob/main/CHANGELOG.rst"

[tool.poetry.dependencies]
python = "^3.9"
djangorestframework = "^3.14.0"


[tool.poetry.group.dev.dependencies]
django = "^4.2"
tox = "^4.15.0"
wheel = "^0.43.0"
docutils = "^0.20.1"
twine = "^5.1.0"
ruff = "^0.4.5"
prospector = "^1.14.0"
coverage = "^7.5.2"
pre-commit = "^4.3.0"
django-stubs = { extras = ["compatible-mypy"], version = "^5.1.3" }
djangorestframework-stubs = "^3.15.3"
types-setuptools = "^80.9.0"


[tool.poetry.group.test.dependencies]
pytest-cov = "^5.0.0"
pytest-django = "^4.8.0"
model-bakery = "^1.18.0"
pytest = "^8.2.1"


[tool.poetry.group.docs.dependencies]
django = "^4.2"
doc8 = "^1.1.1"
readme-renderer = "^43.0"
sphinx = "7.1.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
exclude = [
  "env",
  "venv",
  ".pyenv",
  ".pytest_cache",
  "*/__pycache__/*",
  "*/migrations/*",
  "docs",
]
line-length = 100
target-version = "py38"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
extend-select = [
  # isort
  "I",
]

[tool.ruff.lint.isort.sections]
django = ["django"]
drf = ["rest_framework"]

[tool.ruff.lint.isort]
section-order = [
  "future",
  "standard-library",
  "django",
  "drf",
  "third-party",
  "first-party",
  "local-folder",
]

[tool.mypy]
plugins = [
    "mypy_django_plugin.main",
]
strict_bytes = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["drf_rw_serializers"]
# Same as strict mode
disallow_any_generics = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true
extra_checks = true

[tool.django-stubs]
django_settings_module = "test_settings"
